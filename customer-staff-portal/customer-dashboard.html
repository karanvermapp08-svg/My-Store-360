<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer Dashboard — Business Manager 360</title>
  <link rel="stylesheet" href="./css/portal.css" />
</head>
<body>
  <div class="dash-layout">
    <aside class="dash-sidebar">
      <div>
        <div class="dash-brand">
          <img src="./assets/portal-brand.svg" alt="360" style="width: 34px; height: 34px;" />
          <div>
            <div style="font-weight: 800; font-size: 13px;">Business Manager 360</div>
            <div style="font-size: 11px; color: rgba(255, 228, 230, 0.8);">Customer Portal</div>
          </div>
        </div>
        <nav class="dash-nav" id="custNav">
          <button class="active" data-view="overview">Dashboard</button>
          <button data-view="orders">My Orders</button>
          <button data-view="invoices">My Invoices</button>
          <button data-view="pending">Pending Payments</button>
          <button data-view="addresses">My Addresses</button>
          <button data-view="profile">My Profile</button>
        </nav>
      </div>
      <div style="padding: 12px; border-top: 1px solid rgba(255,255,255,0.12);">
        <button id="logoutSideBtn" class="btn btn-red btn-full">Logout</button>
      </div>
    </aside>

    <div class="dash-main">
      <header class="dash-header">
        <div>
          <div id="custGreeting" style="font-size: 16px; font-weight: 800;">Welcome, Customer</div>
          <div id="custIdLabel" style="font-size: 12px; color: #64748b;">Customer ID: —</div>
        </div>
        <button id="logoutTopBtn" class="btn btn-red">Logout</button>
      </header>

      <main class="dash-content">
        <div class="kpi-grid">
          <div class="kpi-card rose">
            <div class="kpi-label">My Orders</div>
            <div id="kpiOrders" class="kpi-val">0</div>
          </div>
          <div class="kpi-card green">
            <div class="kpi-label">My Invoices</div>
            <div id="kpiInvoices" class="kpi-val">₹0</div>
          </div>
          <div class="kpi-card amber">
            <div class="kpi-label">Pending Payments</div>
            <div id="kpiPending" class="kpi-val">₹0</div>
          </div>
        </div>

        <section class="panel-card" id="mainPanel">
          <h2 id="panelTitle" style="font-size: 15px; font-weight: 800; margin-bottom: 12px;">Recent Orders &amp; Invoices</h2>
          <div id="panelBody" style="font-size: 13px; color: #475569;">Loading your scoped records...</div>
        </section>

        <div class="notice-box notice-ok">
          Welcome to your Customer Dashboard! Only orders and invoices belonging to your Customer ID are displayed here.
        </div>
      </main>
    </div>
  </div>

  <script src="./js/portal-auth.js"></script>
  <script>
    (async function () {
      var auth = window.BM360PortalAuth;
      var session = auth.getSession();
      if (!session || session.sessionType !== 'CUSTOMER') {
        window.location.href = './customer-login.html';
        return;
      }

      var data = await auth.ensureSeedData();
      var cust = data.customers.find(function (c) { return c.id === session.userId; });
      if (!cust || cust.status !== 'Active') {
        auth.setSession(null);
        window.location.href = './customer-login.html';
        return;
      }

      document.getElementById('custGreeting').textContent = 'Welcome, ' + cust.fullName;
      document.getElementById('custIdLabel').textContent = 'Customer ID: ' + cust.customerId + ' | ' + cust.email;

      var allTx = await auth.readAll('transactions');
      var myTx = allTx.filter(function (t) {
        if (t.isCancelled || (t.type !== 'Sale' && t.type !== 'Sale Order')) return false;
        var p = (t.partyName || '').toLowerCase();
        return p === cust.fullName.toLowerCase() || p === (cust.linkedPartyName || '').toLowerCase();
      });

      var totalAmt = myTx.reduce(function (s, t) { return s + (Number(t.totalAmount) || 0); }, 0);
      var pendingAmt = myTx.reduce(function (s, t) { return s + (Number(t.balance) || 0); }, 0);
      document.getElementById('kpiOrders').textContent = String(myTx.length);
      document.getElementById('kpiInvoices').textContent = '₹' + totalAmt.toLocaleString('en-IN');
      document.getElementById('kpiPending').textContent = '₹' + pendingAmt.toLocaleString('en-IN');

      function renderView(view) {
        var title = document.getElementById('panelTitle');
        var body = document.getElementById('panelBody');
        if (view === 'addresses') {
          title.textContent = 'Saved Delivery Addresses';
          var addrs = cust.addresses || [];
          body.innerHTML = addrs.length
            ? addrs.map(function (a) {
                return '<div style="padding:10px;border:1px solid #e2e8f0;border-radius:10px;margin-bottom:8px;"><strong>' + a.label + '</strong> — ' + a.street + ', ' + a.city + ' ' + a.pincode + '</div>';
              }).join('')
            : '<p>No saved addresses yet.</p>';
          return;
        }
        if (view === 'profile') {
          title.textContent = 'Customer Profile';
          body.innerHTML = '<p><strong>Name:</strong> ' + cust.fullName + '</p><p><strong>Customer ID:</strong> ' + cust.customerId + '</p><p><strong>Email:</strong> ' + cust.email + '</p><p><strong>Phone:</strong> ' + cust.phone + '</p>';
          return;
        }
        var rows = view === 'pending' ? myTx.filter(function (t) { return (t.balance || 0) > 0; }) : myTx;
        title.textContent = view === 'pending' ? 'Pending Payments' : 'My Orders & Invoices';
        if (!rows.length) {
          body.innerHTML = '<p>No matching records found for ' + cust.customerId + '.</p>';
          return;
        }
        body.innerHTML = '<table class="data-table"><thead><tr><th>Invoice #</th><th>Date</th><th>Status</th><th>Total</th><th>Balance</th></tr></thead><tbody>' +
          rows.map(function (t) {
            return '<tr><td><strong>#' + t.invoiceNo + '</strong></td><td>' + t.date + '</td><td><span class="badge ' + (t.status === 'Paid' ? 'badge-ok' : 'badge-warn') + '">' + t.status + '</span></td><td>₹' + Number(t.totalAmount).toLocaleString('en-IN') + '</td><td>₹' + Number(t.balance).toLocaleString('en-IN') + '</td></tr>';
          }).join('') +
          '</tbody></table>';
      }

      renderView('overview');

      document.querySelectorAll('#custNav button').forEach(function (btn) {
        btn.onclick = function () {
          document.querySelectorAll('#custNav button').forEach(function (b) { b.classList.remove('active'); });
          btn.classList.add('active');
          renderView(btn.getAttribute('data-view'));
        };
      });

      function doLogout() {
        auth.setSession(null);
        window.location.href = './index.html';
      }
      document.getElementById('logoutTopBtn').onclick = doLogout;
      document.getElementById('logoutSideBtn').onclick = doLogout;
    })();
  </script>
</body>
</html>
